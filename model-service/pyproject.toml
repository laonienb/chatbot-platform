[project]
name = "model-service"
version = "0.1.0"
description = "独立模型服务（S3）— 契约 docs/model-service-protocol.md v1"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
real = ["litellm>=1.40"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["msvc"]
